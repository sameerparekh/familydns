slug: sportys
name: "Sporty's"
icon: "https://icons.duckduckgo.com/ip3/sportys.com.ico"
icon_type: url
# Operator request: Sporty's — the pilot shop and, far more importantly here,
# Sporty's Online Training (the Learn to Fly / instrument course platform at
# courses.sportys.com/training/portal/). Same aviation cluster as the already
# templated `geofs` and `moc-pilot`.
#
# This is the heaviest single-app cluster the catalog has seen: 2.04 GB /
# 365 hits over a 30d window on Kid Laptop alone, plus 23.2 MB / 19 hits on
# Sameer Mac and 7.8 MB / 5 hits on Sameer iPhone. The Kid Laptop bytes are
# course video and nothing else — its only observed subdomains are
# `stream.videos`, `dl.videos` and `ye.courses`; it never touched the store.
#
# Host-set is three SUBDOMAINS, not the bare `sportys.com` apex — a deliberate
# deviation from the "apex hostnames" default in _README.yml, for one reason:
# `images.sportys.com` CNAMEs off Sporty's own infrastructure onto a
# third-party image platform — `media.esp1.co` -> `media.espssl.com` ->
# `media.espssl.com.cdn.cloudflare.net` -> 172.64.144.42 / 104.18.43.214,
# Cloudflare's broadly-shared pool. render.lua emits `nftset=/<host>/`
# verbatim per host and dnsmasq matches by pure suffix, so an apex entry would
# necessarily sweep that shared Cloudflare pool into the `eb_` drop set — the
# same apex-sweep mechanism `arduino.yml` and `canva.yml` document. It has
# also never appeared in observed traffic, so "only template what you've seen
# used" excludes it independently.
#
# The three kept entries suffix-match every one of the five observed hosts
# (`HostMatch.matchesApex`, shared/src/types/HostMatch.scala), and each lands
# on infrastructure that is Sporty's own or a per-service dedicated origin —
# not a shared-tenant pool of the Shopify/Zendesk class `arduino.yml` excludes:
#   www.sportys.com                pilot shop; CNAME sportys.com ->
#                                   199.232.66.132, a Sporty's-specific Fastly
#                                   anycast address
#   videos.sportys.com             covers the two course-video hosts, which
#                                   carry essentially all of the bytes above:
#     stream.videos.sportys.com     streaming; CloudFront 99.84.105.x
#     dl.videos.sportys.com         download; CloudFront 18.238.176.x
#   courses.sportys.com            training portal (16.59.107.150 /
#                                   3.151.66.199), and covers:
#     ye.courses.sportys.com        CNAME prod-ye-training.simplysporty.net ->
#                                   16.59.159.202 / 3.23.25.151
#     pspdfkit.courses.sportys.com  in-course PDF viewer; CNAME
#                                   prod-pspdfkit.simplysporty.net ->
#                                   77.112.172.80 / 77.112.39.76 (Amazon, whois
#                                   AMAZO-4)
#
# `simplysporty.net` is Sporty's own brand-named domain, used here only as the
# CNAME target for its training services, with a dedicated `prod-<service>`
# origin per surface — so those two hosts are first-party infrastructure under
# a second domain, the same shape as `projects.arduinocontent.cc`. It is not
# listed directly: no traffic is attributed to it, only to the `*.sportys.com`
# names clients actually resolve.
#
# The CloudFront and Fastly edges above are the accepted Class-2 latent risk
# from _README.yml — branded per-app hosts that happen to sit on a multi-tenant
# CDN. That IS where this app's bytes live, so stripping them would defeat both
# the block and the time budget.
#
# Residual to record, same as `arduino.yml` and `canva.yml`: bytes to bare
# `sportys.com` go unattributed against the app's budget, and over plain HTTP
# the apex redirect to `www` completes before the drop lands on the follow-on
# request, so the user sees a failed TLS handshake rather than the block page.
#
# Deliberately EXCLUDED beyond `images.sportys.com`: the sibling Sportsman's
# Market brands the store links out to — sportysacademy.com,
# flighttrainingcentral.com, ipadpilotnews.com, airfactsjournal.com,
# sportystoolshop.com, aviationgifts.com, preferredliving.com. Each is a
# separate site on separate infrastructure with no observed traffic; per
# #2596 (`renaissance.com`), a topically adjacent sibling apex needs its own
# evidence before it joins an app's host-set.
hosts:
  - www.sportys.com
  - videos.sportys.com
  - courses.sportys.com
